name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages 2>/dev/null || echo "gh-pages branch does not exist yet"
          git checkout -B gh-pages origin/gh-pages 2>/dev/null || echo "Creating new gh-pages branch"

      - name: Copy built files to gh-pages
        run: |
          # Clear existing files (except .git)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy storybook-static files from main branch
          git checkout main -- storybook-static/
          cp -r storybook-static/* .
          rm -rf storybook-static/

          # Create .nojekyll to skip Jekyll processing
          touch .nojekyll

      - name: Commit and push
        run: |
          git add -A
          git diff-index --quiet HEAD || git commit -m "Deploy: Update Storybook to GitHub Pages"
          git push origin gh-pages -f
