name: Sync Figma Tokens

on:
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'figma-config.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Figma tokens
        run: node scripts/figma-sync.js
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "figma-bot"
          git config user.email "figma-sync@github.com"

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add src/tokens/figma-tokens.json
            git commit -m "chore: sync Figma tokens to design system" \
              -m "Auto-synced from Figma Design System" \
              -m "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              -m "Co-Authored-By: Figma Bot <noreply@figma.com>"
            git push
          fi

      - name: Status report
        if: always()
        run: |
          echo "✅ Figma sync completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
